<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lora:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />

    <!-- Estilos con CSS -->
    <link rel="stylesheet" href="css/style.css" />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Mi script -->
    <script type="module" src="js/Controlers/spellController.js" defer></script>
    <title>Hogwarts | Hechizos</title>
  </head>

  <body class="d-flex flex-column min-vh-100">
    <!-- Header / Barra de Navegación -->
    <header>
      <nav class="navbar navbar-expand-lg navbar-dark navbar-hogwarts shadow-sm py-3">
        <div class="container-fluid px-4">
          <a class="navbar-brand fw-bold fs-4" href="#">⚡ Biblioteca de Hechizos</a>
          <button
            class="navbar-toggler border-warning"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNavAltMarkup"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse justify-content-end" id="navbarNavAltMarkup">
            <div class="navbar-nav gap-3">
              <a class="nav-link" href="index.html">Home</a>
              <a class="nav-link" href="student.html">Estudiantes</a>
              <a class="nav-link" href="teachers.html">Profesores</a>
              <a class="nav-link active"aria-current="page" href="spells.html">Hechizos</a>
            </div>
          </div>
        </div>
      </nav>
    </header>

    <!-- Contenido Principal -->
    <main class="container my-5" style="max-width: 1100px">
      <!-- Título de la Sección -->
      <div class="text-center mb-4">
        <h2 style="font-family: &quot;Cinzel&quot;, serif" class="text-warning fw-bold">
          Registro de Hechizos y Encantamientos
        </h2>
      </div>

      <!-- Tarjeta contenedora de la Tabla -->
      <div class="magic-card p-4">
        <!-- Barra de búsqueda -->
        <div class="row mb-4 align-items-center">
          <div class="col-md-6 mb-2 mb-md-0">
            <span class="text-warning small fw-bold">📜 Compendio Activo de Magia</span>
          </div>
          <div class="col-md-6">
            <div class="input-group" id="form">
              <input 
                type="text" 
                class="form-control bg-dark text-light border-secondary" 
                id="inputBuscarHechizo" 
                placeholder="Buscar hechizo en el compendio..."
              >
              <!-- <button class="btn btn-outline-warning" type="button" id="btnBuscarHechizo">Filtrar</button> -->
            </div>
          </div>
        </div>

        <!-- Tabla Estilizada Optimizada (Solo 2 columnas principales + diseño fluido) -->
      <div class="table-responsive">
        <table class="table table-hover table-hogwarts align-middle mb-0">
          <thead>
            <tr>
              <th scope="col" class="py-3 ps-4 text-center" style="width: 25%;" id="hechizo">Hechizo</th>
              <th scope="col" class="py-3 text-center" style="width: 25%;" id="categoria">Categoría</th>
              <th scope="col" class="py-3 pe-4 text-center" style="width: 50%;" id="description">Descripción</th>
            </tr>
          </thead>
          <tbody id="tabla-hechizos-body">
            <!-- Los datos inyectados por JavaScript se pintarán aquí -->
          </tbody>
        </table>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer-hogwarts text-center py-3 mt-auto">
      <div class="container">
        <p class="mb-1">© 2026 J&S. Todos los derechos reservados.</p>
        <p class="mb-0 small">Desarrollado por Ing. Shania Gómez</p>
      </div>
    </footer>
  </body>
</html>
