<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="buscador.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>Buscador JSONPlaceholder</title>
</head>


<!-- Fondo gris claro, centrado en la pantalla -->
<body class="bg-light d-flex flex-column align-items-center justify-content-center vh-100">
    <header class="text-center py-4 bg-white shadow-sm mb-4">
        <div class="container">
            <h2 class="fw-bold text-primary mb-1">Directorio de JSONPlaceholder</h2>
            <h5 class="text-muted fs-6 mb-0">Consulta de Expediente</h5>
        </div>
    </header>

    <main class="container w-100" style="max-width: 800px;">
        
        <!-- Tarjeta para el buscador -->
        <div class="card shadow-sm p-4 mb-4">
            <div class="input-group">
                <h3 id="msgError"></h3>
                <input type="text" class="form-control" id="exampleFormControlInput" placeholder="Ingrese el nro de ID">
                <button type="button" class="btn btn-primary px-4" id="button">BUSCAR</button>
            </div>
        </div>

        <!-- Tarjeta para la tabla -->
        <div class="card shadow-sm p-4">
            <div class="table-responsive">
                <table class="table table-hover align-middle  text-center mb-0">
                    
                    <!-- Primera sección -->
                    <thead class="table-primary">
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">NAME</th>
                            <th scope="col">USERNAME</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td id="td-id"></td>
                            <td id="td-name"></td>
                            <td id="td-username"></td>
                        </tr>
                    </tbody>

                    <!-- Segunda sección -->
                    <thead class="table-primary border-top border-3 border-white">
                        <tr>
                            <th scope="col">EMAIL</th>
                            <th scope="col">PHONE</th>
                            <th scope="col">WEBSITE</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td id="td-email"></td>
                            <td id="td-phone"></td>
                            <td id="td-website"></td>
                        </tr>
                    </tbody>

                </table>
            </div>
        </div>

    </main>
    
    <footer class="text-center py-3 bg-white border-top mt-5 text-muted small">
        <div class="container">
            <p class="mb-1">© 2025 J&S. Todos los derechos reservados.</p>
            <p class="mb-0">Desarrollado por Ing. Shania Gomez</p>
        </div>
    </footer>
</body>


</html>
