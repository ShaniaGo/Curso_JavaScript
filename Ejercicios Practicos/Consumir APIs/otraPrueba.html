<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <title>Buscador JSONPlaceholder</title>

<!-- Fondo gris claro, centrado en la pantalla -->
<body class="bg-light d-flex flex-column align-items-center justify-content-center vh-100">

    <main class="container w-100" style="max-width: 800px;">
        
        <!-- Tarjeta para el buscador -->
        <div class="card shadow-sm p-4 mb-4">
            <div class="input-group">
                <input type="text" class="form-control" id="exampleFormControlInput" placeholder="Ingrese el nro de ID">
                <button type="button" class="btn btn-primary px-4">BUSCAR</button>
            </div>
        </div>

        <!-- Tarjeta para la tabla -->
        <div class="card shadow-sm p-4">
            <div class="table-responsive">
                <table class="table table-hover align-middle  text-center mb-0">
                    
                    <!-- Primera sección -->
                    <thead class="table-primary">
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">NAME</th>
                            <th scope="col">USERNAME</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>algo aqui</td>
                            <td>otra cosa</td>
                            <td>mas cosas</td>
                        </tr>
                    </tbody>

                    <!-- Segunda sección -->
                    <thead class="table-primary border-top border-3 border-white">
                        <tr>
                            <th scope="col">EMAIL</th>
                            <th scope="col">PHONE</th>
                            <th scope="col">WEBSITE</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>algo aqui</td>
                            <td>otra cosa</td>
                            <td>mas cosas</td>
                        </tr>
                    </tbody>

                </table>
            </div>
        </div>

    </main>
    
</body>
</html>
